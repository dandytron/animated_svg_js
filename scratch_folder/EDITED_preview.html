<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EDITED stacked chart preview</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #121212;                 /* dark backdrop so white text shows */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .frame {
      outline: 1px dashed rgba(255,255,255,0.25);  /* shows the 600x216 canvas edge */
    }
    img { display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <img src="EDITED_unedited_stacked_chart.svg" width="600" height="238" alt="edited chart">
  </div>
</body>
</html>
